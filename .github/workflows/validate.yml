name: Validate PromptTantu
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog integrity and numbering
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Verify dry-run CLI
        run: python tools/gemini_runner.py P150050 --var AGENT_A_TASK="Extract" --var AGENT_B_TASK="Review"
